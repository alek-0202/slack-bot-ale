name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if present)
        run: npm run test --if-present

      - name: Prepare .env for Docker Compose validation
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "[warn] .env.example not found. Creating empty .env for CI validation."
            touch .env
          fi

      - name: Validate Docker Compose file
        run: docker compose config
